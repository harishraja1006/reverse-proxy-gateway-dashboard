services:

  loadbalancer:
    build: .
    container_name: reverse-proxy

    env_file:
      - .env

    environment:
      SERVICE: proxy

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    depends_on:
      server1:
        condition: service_started
      server2:
        condition: service_started
      server3:
        condition: service_started

  server1:
    build: .
    container_name: backend-server-1

    environment:
      SERVICE: server1

    ports:
      - "5001:5001"

    restart: unless-stopped

  server2:
    build: .
    container_name: backend-server-2

    environment:
      SERVICE: server2

    ports:
      - "5002:5002"

    restart: unless-stopped

  server3:
    build: .
    container_name: backend-server-3

    environment:
      SERVICE: server3

    ports:
      - "5003:5003"

    restart: unless-stopped
